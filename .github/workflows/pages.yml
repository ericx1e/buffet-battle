# Every push to main: test and deploy the API (Cloudflare Worker + D1 migrations), then test, build and publish the
# game to GitHub Pages, pointed at that API. The API goes first so the live game never runs ahead of its server.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  API_URL: https://buffet-battle-api.ericxie6.workers.dev

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx wrangler d1 migrations apply buffet-battle --remote
      - run: npx wrangler deploy
      - name: The API answers on the version this commit built
        run: |
          expected=$(sed -n "s/.*GAME_VERSION = '\(.*\)'.*/\1/p" ../src/sim/version.ts)
          for i in 1 2 3 4 5 6; do
            got=$(curl -s "$API_URL/" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')
            [ "$got" = "$expected" ] && echo "API on $got" && exit 0
            sleep 5
          done
          echo "API reports '$got', expected '$expected'" && exit 1

  build:
    needs: api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_API_URL: ${{ env.API_URL }}
          # Cloudflare Web Analytics on the game page: the beacon token, a repository variable (empty: no analytics).
          VITE_CF_BEACON: ${{ vars.CF_BEACON_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
